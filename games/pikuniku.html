<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/larpinguser/pikuniku@main/" />
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      (function () {
        var MANIFEST = {
          "Build/pikubog.data.unityweb": [
            "Build/pikubog.data.unityweb.part1",
            "Build/pikubog.data.unityweb.part2",
            "Build/pikubog.data.unityweb.part3",
            "Build/pikubog.data.unityweb.part4",
            "Build/pikubog.data.unityweb.part5",
            "Build/pikubog.data.unityweb.part6",
          ],
          "Build/pikubog.wasm.code.unityweb": [
            "Build/pikubog.wasm.code.unityweb.part1",
            "Build/pikubog.wasm.code.unityweb.part2",
          ],
        };
        function fetchArrayBuffer(url) {
          return fetch(url).then(function (res) {
            if (!res.ok) {
              throw new Error(
                "Failed to fetch " + url + " (" + res.status + ")",
              );
            }
            return res.arrayBuffer();
          });
        }
        function concatBuffers(buffers) {
          var total = buffers.reduce(function (sum, b) {
            return sum + b.byteLength;
          }, 0);
          var merged = new Uint8Array(total);
          var offset = 0;
          buffers.forEach(function (b) {
            merged.set(new Uint8Array(b), offset);
            offset += b.byteLength;
          });
          return merged.buffer;
        }
        var mergedAssets = {};
        function mergeAllParts(onProgress) {
          var keys = Object.keys(MANIFEST);
          var done = 0;
          return Promise.all(
            keys.map(function (key) {
              return Promise.all(MANIFEST[key].map(fetchArrayBuffer))
                .then(concatBuffers)
                .then(function (buffer) {
                  mergedAssets[key] = URL.createObjectURL(new Blob([buffer]));
                  done++;
                  if (onProgress) onProgress(done, keys.length);
                });
            }),
          );
        }
        var originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          var args = Array.prototype.slice.call(arguments);
          for (var key in mergedAssets) {
            if (url.indexOf(key) !== -1) {
              args[1] = mergedAssets[key];
              break;
            }
          }
          return originalOpen.apply(this, args);
        };
        window.__startUnity = function () {
          var statusEl = document.getElementById("mergeStatus");
          mergeAllParts(function (done, total) {
            if (statusEl)
              statusEl.textContent =
                "Merging assets... (" + done + "/" + total + ")";
          })
            .then(function () {
              if (statusEl) statusEl.style.display = "none";
              window.unityInstance = UnityLoader.instantiate(
                "unityContainer",
                "Build/pikubog.json",
                {
                  onProgress: UnityProgress,
                },
              );
            })
            .catch(function (err) {
              if (statusEl)
                statusEl.textContent =
                  "Failed to load game assets: " + err.message;
              console.error(err);
            });
        };
      })();
    </script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-PXHK7Q7G3Z");
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121e1e;
      }
      .webgl-content {
        width: 100%;
        height: 100%;
      }
      #unityContainer {
        width: 100%;
        height: 100%;
      }
      #unityContainer canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #mergeStatus {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #eee;
        font: 14px sans-serif;
        z-index: 10;
      }
    </style>
  </head>

  <body onload="window.__startUnity()">
    <div class="webgl-content">
      <div id="unityContainer" style="width: 100%; height: 100%"></div>
      <div id="mergeStatus">Merging assets...</div>
    </div>
  </body>
</html>
