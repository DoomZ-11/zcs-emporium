<!DOCTYPE html>
<html lang="en">
    <head>
        <title>ZC's Online Emporium</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="ZC's Online Emporium - A collection of online browser games.">
        <meta name="theme-color" content="#000000">
        <base href="https://raw.githack.com/DoomZ-11/zcs-emporium/refs/heads/main/">
        <link rel="stylesheet" href="./src/style/base.css">
        <link rel="icon" type="image/png" href="images/favicon.png">
    </head>
    <body style="background: #000000;">
        <div class="click-to-focus hidden" id="click-to-focus">Click Window to Focus</div>

        <div class="back-overlay hidden" id="back-overlay"></div>

        <div class="header" id="header">
            <h1 class="header-title" id="header-title">
                - ZC's Online Emporium -
            </h1>
        </div>

        <div class="main-content-container">

            <div class="background-container">
                <div class="bg-layer-1"></div>
                <div class="bg-layer-2"></div>
                <div class="bg-layer-3"></div>
            </div>

            <aside class="sidebar">
                <input class="search-bar" id="search-bar" type="text" placeholder="Search..." maxlength="36" autocomplete="off">

                <h2 class="sidebar-label">
                    Discover
                </h2>
                <div class="nav-container" id="discover-container"></div>

                <h2 class="sidebar-label">
                    Genres
                </h2>
                <div class="nav-container" id="genre-container"></div>

                <p class="theme-cycle-label" id="theme-cycle-label"></p>
                <button class="theme-cycle-button" id="theme-cycle-button" type="button"></button>
                <p class="theme-cycle-text" id="theme-cycle-text">Click to change theme.</p>

                <span class="info-container">
                    v.1.0.4<br>
                    ZC's Emporium
                </span>
            </aside>
            
            <div class="library-container">
                <h3 class="library-header" id="library-header">
                    All Games
                </h3>
                <div class="icon-container" id="icon-container"></div>
                <footer class="footer">
                    <a class="contact-text" href="https://forms.gle/TALuzCXY8oMQrTiV7" target="_blank">▶ Contact ◀</a>
                    <p class="copyright-text">
                        © 2026 Zane W. Clark.
                    </p>
                </footer>
            </div>
        </div>

        <div class="launcher-window hidden" id="launcher-window">
            <div class="launcher-divider"></div>

            <h4 class="launcher-title" id="launcher-title"></h4>

            <img class="launcher-icon" id="launcher-icon">
            <p class="launcher-tags" id="launcher-tags"></p>

            <div class="launcher-divider"></div>

            <button class="launcher-button-primary" id="launcher-launch-button" type="button">[ Launch ]</button>

            <div class="launcher-divider"></div>
            
            <button class="launcher-button-secondary" id="launcher-newtab" type="button">▶ open in new tab ◀</button>
            <button class="launcher-button-secondary" id="launcher-newwindow" type="button">▶ open in new window ◀</button>

            <div class="launcher-divider"></div>

            <button class="launcher-button-secondary" id="launcher-close-button" type="button">« Close »</button>

            <div class="launcher-divider"></div>
        </div>

        <div class="player-container hidden" id="player-container">
            <div class="player-header">
                <h1 class="player-header-title" id="header-title">
                    - ZC's Online Emporium -
                </h1>
            </div>

            <iframe class="game-frame" id="game-frame"></iframe>

            <div class="player-toolbar">
                <button class="player-toolbar-button" id="player-close-button" type="button">×</button>

                <button class="player-toolbar-button" id="player-zoom-out-button" type="button">-</button>

                <button class="player-game-title" id="player-game-title" type="button"></button>

                <button class="player-toolbar-button" id="player-zoom-in-button" type="button">+</button>

                <button class="player-toolbar-button" id="player-fullscreen-button" type="button">[]</button>
            </div>
        </div>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
